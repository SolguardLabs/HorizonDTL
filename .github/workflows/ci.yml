name: CI

on:
    push:
        branches:
            - main
            - production
            - "release/**"
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: Rust y Bun (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                os:
                    - ubuntu-latest
                    - windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Configurar Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache Cargo
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      target
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-

            - name: Configurar Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Configurar Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Validar proyecto
              shell: bash
              run: bash scripts/ci.sh
