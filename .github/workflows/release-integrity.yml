name: Release integrity

on:
    push:
        branches:
            - main
            - production
        tags:
            - "v*"
    release:
        types:
            - published
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: release-integrity-${{ github.ref }}
    cancel-in-progress: false

jobs:
    validate:
        name: Contrato de release
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.release.tag_name || github.ref }}

            - name: Configurar Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Configurar Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            - name: Configurar Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.13"

            - name: Ejecutar cadena completa
              run: bash scripts/ci.sh

            - name: Verificar referencias publicadas
              if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
              env:
                  EXPECTED_SHA: ${{ github.sha }}
              run: python scripts/verify_published_ref.py --expected-sha "$EXPECTED_SHA"
